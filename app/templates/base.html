<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>{% block title %}sakinfan.com - Sakin Grubu Hayran Forumu{% endblock %}</title>
  </head>
  <body>
    <div class="main-wrapper">
      <header>
        <img src="/static/banner.png" alt="sakinfan.com" class="top-banner" />
        <nav>
          | <a href="/">ANA SAYFA</a> | 
          {% if user %}
          <span>Merhaba, <strong>{{ user.username }}</strong></span> |
          <form action="/logout" method="POST" style="display: inline">
            <input
              type="hidden"
              name="csrftoken"
              value="{{ request.scope['csrftoken']() }}"
            />
            <button
              type="submit"
              style="
                background: none;
                border: none;
                padding: 0 10px;
                color: #3b3632;
                cursor: pointer;
                font-family: inherit;
                font-size: inherit;
              "
            >
              ÇIKIŞ YAP
            </button>
          </form> |
          {% else %}
          <a href="/login">GİRİŞ YAP</a> | <a href="/register">KAYIT</a> |
          {% endif %}
        </nav>
      </header>

      <main>{% block content %}{% endblock %}</main>

      <footer>
        <p>&copy; 2026 sakinfan.com</p>
      </footer>
    </div>
  </body>
</html>
