<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
    <title>{% block title %}sakinfan.com - Sakin Grubu Hayran Forumu{% endblock %}</title>
  </head>
  <body>
    <header>
      <h1>sakinfan.com</h1>
      <nav>
        <a href="/">Ana Sayfa</a> | {% if user %} Giriş yapıldı:
        <strong>{{ user.username }}</strong> |
        <form action="/logout" method="POST" style="display: inline">
          <input
            type="hidden"
            name="csrftoken"
            value="{{ request.scope['csrftoken']() }}"
          />
          <button
            type="submit"
            style="
              background: none;
              border: none;
              padding: 0;
              color: blue;
              text-decoration: underline;
              cursor: pointer;
            "
          >
            Çıkış Yap
          </button>
        </form>
        {% else %}
        <a href="/login">Giriş Yap</a> | <a href="/register">Kayıt Ol</a>
        {% endif %}
      </nav>
      <hr />
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <hr />
      <p>&copy; 2026 sakinfan.com</p>
    </footer>
  </body>
</html>
